<style>
  :root {
    --brand-accent: #49d3ff;
    --brand-accent-2: #6ee7c9;
    --color-bg: #05070a;
    --color-text: #ffffff8a;
    --color-text-muted: rgba(244, 241, 234, 0.6);

    --font-body: "Inter", sans-serif;

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  @media (min-width: 769px) and (pointer: fine) {
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  .canvas-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100lvh;
    background: #05070a;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  .hero-text {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    letter-spacing: 0.07em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;
  }

  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;
  }
  .scene-text--left    { align-items: flex-start; text-align: left; }
  .scene-text--center  { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); max-width: 640px; }
  .scene-text--right   { align-items: flex-end; text-align: right; margin-left: auto; }

  .scene-text__eyebrow {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);
  }
  .kinetic-word { display: inline-block; }
  .kinetic-char {
    display: inline-block;
    will-change: transform, opacity, filter;
  }
  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(200, 255, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(200, 255, 0, 0.5);
  }

  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;
    transform: translateY(-50%);
    height: 28vh;
    z-index: 6;
  }
  .progress-rail__track {
    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--rail-color, var(--brand-accent));
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  /* ---- Botón "volver arriba": vidrio neutro, se ve sobre cualquier fondo ---- */
  .backtop { --bt-size: 46px; position: fixed; z-index: 9; bottom: calc(var(--bt-bottom, 24px) + env(safe-area-inset-bottom));
    width: var(--bt-size); height: var(--bt-size); margin: 0; padding: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    color: var(--bt-fg, #fff); background: var(--bt-bg, rgba(12,12,16,.5)); border: 1px solid var(--bt-line, rgba(255,255,255,.26));
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 6px 22px rgba(0,0,0,.28); -webkit-tap-highlight-color: transparent; font: inherit;
    opacity: 0; visibility: hidden; transform: translateY(14px) scale(.86);
    transition: opacity .4s ease, transform .5s cubic-bezier(.2,.9,.25,1.15), visibility 0s linear .5s, background .25s ease; }
  .backtop.is-on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .backtop:hover { background: var(--bt-bg-h, rgba(12,12,16,.7)); }
  .backtop:active { transform: scale(.94); }
  .backtop:focus-visible { outline: 2px solid var(--bt-fg, #fff); outline-offset: 3px; }
  .backtop--right { right: 24px; } .backtop--left { left: 24px; }
  .backtop--center { left: 50%; margin-left: calc(var(--bt-size) / -2); }
  .app-root--phone .backtop--right { right: max(14px, calc(50% - min(220px, 50vw) + 14px)); }
  .app-root--phone .backtop--left { left: max(14px, calc(50% - min(220px, 50vw) + 14px)); }
  .backtop--light { --bt-fg: #111; --bt-bg: rgba(255,255,255,.62); --bt-line: rgba(0,0,0,.14); --bt-bg-h: rgba(255,255,255,.85); box-shadow: 0 6px 22px rgba(0,0,0,.16); }
  .backtop--accent { --bt-fg: #0a0a0a; --bt-bg: var(--bt-accent, var(--brand-accent)); --bt-line: transparent; --bt-bg-h: var(--bt-accent, var(--brand-accent)); }
  .backtop__ring { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); transform: rotate(-90deg); pointer-events: none; }
  .backtop__ring circle { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .backtop__ring .bt-track { opacity: .18; }
  .backtop__ring .bt-fill { stroke-linecap: round; transition: stroke-dashoffset .12s linear; }
  .backtop__ico { width: 40%; height: 40%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s ease; }

  .brand-mark {
    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);
  }

  .scroll-hint {
    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    opacity: 0.7;
  }
  .scroll-hint__line {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--color-text-muted), transparent);
    animation: scrollHintPulse 2s ease-in-out infinite;
  }
  @keyframes scrollHintPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .cursor-trail-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .scroll-spacer { width: 100%; }

  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }

  /* ---- Zona fija de abajo (WhatsApp · Cómo llegar · Turnero) ----
     Todo en px: el tamaño es el mismo en PC y en celulares. La escena sigue a pantalla completa. */
  .scene-canvas { position: absolute; inset: 0; }
  .app-root--phone .scroll-hint { bottom: calc(190px + env(safe-area-inset-bottom)); }
  /* Columna 9:16: la escena se ve SIEMPRE con la composición del visor 9:16 del editor. En celular (más angosto o igual a 9:16)
     ocupa todo el ancho; en PC / tablet queda una columna centrada del alto de la ventana y el resto es fondo liso. */
  .app-root--col { --col-w: min(100vw, calc(100vh * 9 / 16)); --col-w: min(100vw, calc(100lvh * 9 / 16)); background: var(--color-bg, #05070a); min-height: 100vh; }
  .app-root--col .canvas-stage { right: auto; left: calc(50% - var(--col-w) / 2); width: var(--col-w); }
  .app-root--col .dock { width: min(440px, var(--col-w)); }
  .app-root--col .progress-rail, .app-root--col .scroll-hint, .app-root--col .brand-mark { position: absolute; }
  .app-root--col .brand-mark { left: 14px; }
  .app-root--col .progress-rail { right: 14px; }
  .app-root--col .scroll-hint { left: 14px; }
  .app-root--col .dock-shade { right: auto; left: calc(50% - var(--col-w) / 2); width: var(--col-w); }
  .app-root--phone .cta-layer { display: none; }
  .dock-shade { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; pointer-events: none;
    height: calc(var(--shade-pct) * 1vh); height: calc(var(--shade-pct) * 1lvh); opacity: var(--shade-opacity);

  .dock { position: fixed; z-index: 8; left: 50%; bottom: 0; transform: translateX(-50%); width: 440px; max-width: 100%; box-sizing: border-box;
    padding: 8px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px;
    font-family: var(--font-body); color: #fff; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; --dock-accent: var(--brand-accent); }

    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-family: inherit; }
  .dock__row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dock__btn { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px; text-decoration: none; min-width: 0; height: 50px; box-sizing: border-box; }
  .dock__ico { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center; }
  .dock__ico svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 1.05; stroke-linecap: round; stroke-linejoin: round; }
  .dock__txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .dock__txt b { font-weight: 500; font-size: 11px; line-height: 1; letter-spacing: .18em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock__txt small { font-weight: 400; font-size: 8.5px; line-height: 1; letter-spacing: .1em; opacity: .85; display: flex; align-items: center; gap: 5px; min-width: 0; }
  .dock__txt small span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dock__confirm { margin-left: auto; padding: 8px 12px; border-radius: 999px; background: var(--dock-accent); color: #0a0a0a; font-weight: 600; font-size: 10px; line-height: 1; letter-spacing: .06em; text-decoration: none; white-space: nowrap; }
  .dock__days-wrap { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .dock__days { flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto; padding: 0 20px; scroll-padding: 0 20px; scroll-snap-type: x proximity; scrollbar-width: none; overscroll-behavior-x: contain;

<script>
  /* Scroll con inercia (Lenis). No requiere tocar el resto del código:
     Lenis intercepta la rueda/touch y anima window.scrollTo() de forma
     suave, disparando eventos "scroll" nativos igual que siempre — así
     que useScrollProgress() sigue funcionando sin cambios, solo que
     ahora el movimiento llega amortiguado en vez de "a saltos". */
  (function () {
    if (typeof Lenis === "undefined") return;
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false, // en mobile el scroll táctil nativo se siente mejor
    });
    function raf(time) {
      if (window.__lenis) window.__lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    window.__lenis = lenis; // por si algún otro script necesita pausarlo/reanudarlo
  })();
</script>
